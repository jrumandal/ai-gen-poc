# Top-level local development workspace.
#
# This links the separate repos together for LOCAL development and local CI
# validation, so `@jrumandal/*` resolves to the local source instead of
# a remote registry. Each repo still keeps its own package.json, toolchain, and
# CI workflow — this file is only a local-dev convenience.
#
# When a real registry (npmjs.com or a working GitHub Packages account) is
# available, consumers can drop the `workspace:*` protocol and install the
# published versions instead.
packages:
  - 'shared/packages/*'
  - 'cart'
  - 'catalog'
  - 'user'
  - 'shell'
  # Backend (each an independently versioned repo)
  - 'server-shared'
  - 'gateway'
  - 'catalog-svc'
  - 'cart-svc'
  - 'user-svc'
  - 'mobile'
allowBuilds:
  '@apollo/protobufjs': true
  '@nestjs/core': true
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  prisma: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@angular/common@22.1.5'
  - '@angular/compiler-cli@22.1.5'
  - '@angular/compiler@22.1.5'
  - '@angular/core@22.1.5'
  - '@angular/elements@22.1.5'
  - '@angular/language-service@22.1.5'
  - '@angular/platform-browser@22.1.5'
  - '@angular/platform-server@22.1.5'
  - '@angular/router@22.1.5'
# Force a single @angular/* version across the whole local workspace so the
# shell (22.1.5) and the Angular MF apps (catalog) don't pull two copies of
# @angular/core, which breaks the esbuild-based Angular compiler.
overrides:
  '@angular/common': 22.1.5
  '@angular/compiler': 22.1.5
  '@angular/compiler-cli': 22.1.5
  '@angular/core': 22.1.5
  '@angular/elements': 22.1.5
  '@angular/language-service': 22.1.5
  '@angular/platform-browser': 22.1.5
  '@angular/platform-server': 22.1.5
  '@angular/router': 22.1.5
  '@angular/ssr': 22.1.7
  '@angular/build': 22.1.7
  '@angular/cli': 22.1.7
