# Top-level local development workspace.
#
# This links the separate repos together for LOCAL development and local CI
# validation, so `@jrumandal/*` resolves to the local source instead of
# a remote registry. Each repo still keeps its own package.json, toolchain, and
# CI workflow — this file is only a local-dev convenience.
#
# When a real registry (npmjs.com or a working GitHub Packages account) is
# available, consumers can drop the `workspace:*` protocol and install the
# published versions instead.
packages:
  - 'shared/packages/*'
  - 'cart'
  - 'catalog'
  - 'user'
  - 'shell'
  # Backend (each an independently versioned repo)
  - 'server-shared'
  - 'gateway'
  - 'catalog-svc'
  - 'cart-svc'
  - 'user-svc'
  - 'mobile'
allowBuilds:
  '@apollo/protobufjs': true
  '@nestjs/core': true
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  prisma: true
  unrs-resolver: true
# Force a single @angular/* version across the whole local workspace so the
# shell (20.3.29) and the Angular MF apps (catalog) don't pull two copies of
# @angular/core, which breaks the esbuild-based Angular compiler.
overrides:
  '@angular/common': 20.3.29
  '@angular/compiler': 20.3.29
  '@angular/compiler-cli': 20.3.29
  '@angular/core': 20.3.29
  '@angular/elements': 20.3.29
  '@angular/language-service': 20.3.29
  '@angular/platform-browser': 20.3.29
  '@angular/platform-server': 20.3.29
  '@angular/router': 20.3.29
  '@angular/ssr': 20.3.29
  '@angular/build': 20.3.29
  '@angular/cli': 20.3.29
