name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout shell
        uses: actions/checkout@v4
        with:
          repository: jrumandal/shell
          path: shell

      - name: Checkout shared (sibling workspace)
        uses: actions/checkout@v4
        with:
          repository: jrumandal/shared
          path: shared

      - name: Checkout cart (sibling workspace)
        uses: actions/checkout@v4
        with:
          repository: jrumandal/cart
          path: cart

      - name: Checkout catalog (sibling workspace)
        uses: actions/checkout@v4
        with:
          repository: jrumandal/catalog
          path: catalog

      - name: Checkout user (sibling workspace)
        uses: actions/checkout@v4
        with:
          repository: jrumandal/user
          path: user

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Link sibling packages into a workspace
        run: |
          cat > pnpm-workspace.yaml <<'WSPEOF'
          packages:
            - "shared/packages/*"
            - "cart"
            - "catalog"
            - "user"
            - "shell"
          WSPEOF
          printf '{\n  "name": "mf-workspace",\n  "private": true\n}\n' > package.json

      - name: Install
        run: pnpm install

      - name: Lint
        working-directory: shell
        run: pnpm lint

      - name: Typecheck
        working-directory: shell
        run: pnpm typecheck

      - name: Test
        working-directory: shell
        run: pnpm test

      - name: Build
        working-directory: shell
        run: pnpm build
