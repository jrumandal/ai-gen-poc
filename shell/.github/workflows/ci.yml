name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout shell
        uses: actions/checkout@v4
        with:
          repository: jrumandal/shell
          path: shell

      - name: Checkout shared (sibling workspace)
        uses: actions/checkout@v4
        with:
          repository: jrumandal/shared
          path: shared

      - name: Checkout cart (sibling workspace)
        uses: actions/checkout@v4
        with:
          repository: jrumandal/cart
          path: cart

      - name: Checkout catalog (sibling workspace)
        uses: actions/checkout@v4
        with:
          repository: jrumandal/catalog
          path: catalog

      - name: Checkout user (sibling workspace)
        uses: actions/checkout@v4
        with:
          repository: jrumandal/user
          path: user

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Link sibling packages into a workspace
        run: |
          cat > pnpm-workspace.yaml <<'WSPEOF'
          packages:
            - "shared/packages/*"
            - "cart"
            - "catalog"
            - "user"
            - "shell"
          allowBuilds:
            '@apollo/protobufjs': true
            '@nestjs/core': true
            '@parcel/watcher': true
            '@prisma/client': true
            '@prisma/engines': true
            '@scarf/scarf': true
            esbuild: true
            lmdb: true
            msgpackr-extract: true
            prisma: true
            unrs-resolver: true
          overrides:
            '@angular/common': 22.1.5
            '@angular/compiler': 22.1.5
            '@angular/compiler-cli': 22.1.5
            '@angular/core': 22.1.5
            '@angular/elements': 22.1.5
            '@angular/language-service': 22.1.5
            '@angular/platform-browser': 22.1.5
            '@angular/platform-server': 22.1.5
            '@angular/router': 22.1.5
            '@angular/ssr': 22.1.7
            '@angular/build': 22.1.7
            '@angular/cli': 22.1.7
          WSPEOF
          printf '{\n  "name": "mf-workspace",\n  "private": true\n}\n' > package.json

      - name: Install
        run: pnpm install

      - name: Lint
        working-directory: shell
        run: pnpm lint

      - name: Typecheck
        working-directory: shell
        run: pnpm typecheck

      - name: Test
        working-directory: shell
        run: pnpm test

      - name: Build
        working-directory: shell
        run: pnpm build
