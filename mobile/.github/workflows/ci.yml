name: mobile-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Validate mobile (web sync + typecheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mobile
        uses: actions/checkout@v4
        with:
          repository: jrumandal/mobile
          path: mobile
          ref: ${{ github.ref }}

      - name: Checkout shell (web source)
        uses: actions/checkout@v4
        with:
          repository: jrumandal/shell
          path: shell
          ref: main

      - name: Checkout shared (sibling workspace)
        uses: actions/checkout@v4
        with:
          repository: jrumandal/shared
          path: shared
          ref: main

      - name: Checkout cart (sibling workspace)
        uses: actions/checkout@v4
        with:
          repository: jrumandal/cart
          path: cart
          ref: main

      - name: Checkout catalog (sibling workspace)
        uses: actions/checkout@v4
        with:
          repository: jrumandal/catalog
          path: catalog
          ref: main

      - name: Checkout user (sibling workspace)
        uses: actions/checkout@v4
        with:
          repository: jrumandal/user
          path: user
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Link siblings into a workspace
        run: |
          cat > pnpm-workspace.yaml <<'WSPEOF'
          packages:
            - "shell"
            - "shared/packages/*"
            - "cart"
            - "catalog"
            - "user"
            - "mobile"
          allowBuilds:
            '@apollo/protobufjs': true
            '@nestjs/core': true
            '@parcel/watcher': true
            '@prisma/client': true
            '@prisma/engines': true
            '@scarf/scarf': true
            esbuild: true
            lmdb: true
            msgpackr-extract: true
            prisma: true
            unrs-resolver: true
          overrides:
            '@angular/common': 20.3.29
            '@angular/compiler': 20.3.29
            '@angular/compiler-cli': 20.3.29
            '@angular/core': 20.3.29
            '@angular/elements': 20.3.29
            '@angular/language-service': 20.3.29
            '@angular/platform-browser': 20.3.29
            '@angular/platform-server': 20.3.29
            '@angular/router': 20.3.29
            '@angular/ssr': 20.3.29
            '@angular/build': 20.3.29
            '@angular/cli': 20.3.29
          WSPEOF
          printf '{\n  "name": "mf-workspace",\n  "private": true\n}\n' > package.json

      - name: Install (shell workspace)
        run: pnpm install

      - name: Build shell (web source)
        working-directory: shell
        run: pnpm build

      - name: Install mobile deps
        working-directory: mobile
        run: pnpm install

      - name: Sync shell build into web/
        working-directory: mobile
        run: pnpm build-web

      - name: Typecheck (capacitor.config.ts)
        working-directory: mobile
        run: pnpm exec tsc -p tsconfig.json --noEmit

      - name: Verify web/ entry
        working-directory: mobile
        run: |
          test -f web/index.html
          ls web/*.css
          echo "web/ entry OK"
