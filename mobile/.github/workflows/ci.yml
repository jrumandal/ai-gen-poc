name: mobile-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Validate mobile (web sync + typecheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mobile
        uses: actions/checkout@v4
        with:
          repository: jrumandal/mobile
          path: mobile
          ref: ${{ github.ref }}

      - name: Checkout shell (web source)
        uses: actions/checkout@v4
        with:
          repository: jrumandal/shell
          path: shell
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - name: Build shell (web source)
        working-directory: shell
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install mobile deps
        working-directory: mobile
        run: pnpm install --frozen-lockfile

      - name: Sync shell build into web/
        working-directory: mobile
        run: pnpm build-web

      - name: Typecheck (capacitor.config.ts)
        working-directory: mobile
        run: pnpm exec tsc -p tsconfig.json --noEmit

      - name: Verify web/ entry
        working-directory: mobile
        run: |
          test -f web/index.html
          ls web/*.css
          echo "web/ entry OK"
