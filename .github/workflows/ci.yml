# CI for the micro-frontend reference architecture (Nx + pnpm monorepo).
#
# Pipeline (per plan.md §CI): install -> lint -> typecheck -> test -> build.
# All commands run from the `microfrontend/` workspace directory.
#
# Runtime pinning: the repo has NO `packageManager` field and NO `.nvmrc`,
# so Node + pnpm are pinned explicitly here (Node 22, pnpm 11.24.0).
#
# The optional Capacitor Android build is a separate job (needs JDK 21 +
# Android SDK 36) and only runs on manual `workflow_dispatch`, since it is
# not part of the standard dev flow (which builds Android on the Windows host).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # Avoid the Nx daemon in CI (it can hold locks / swallow output in containers).
  NX_DAEMON: "false"

jobs:
  ci:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microfrontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: microfrontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint:all

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (unit)
        run: pnpm test:all

      - name: Build
        run: pnpm build:all

  # Optional: build the Capacitor Android app.
  # Requires JDK 21 (capacitor-camera) + Android SDK 36 (compileSdk 36).
  # Runs only on manual dispatch to keep the default pipeline fast.
  android:
    name: Capacitor Android build (optional)
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: microfrontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: microfrontend/pnpm-lock.yaml

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shell web bundle + sync to mobile
        run: pnpm nx build-web mobile

      - name: Build Android APK
        run: pnpm nx build-android mobile
