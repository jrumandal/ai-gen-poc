openapi: 3.0.3
info:
  title: Cart API
  version: 1.0.0
  description: Shopping cart service contract (microfrontend).
servers:
  - url: http://localhost:4002
    description: Local cart service
tags:
  - name: cart
paths:
  /cart/{cartId}:
    get:
      tags: [cart]
      operationId: getCart
      summary: Get a cart by id
      parameters:
        - name: cartId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '404':
          description: Cart not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [cart]
      operationId: clearCart
      summary: Remove all items from the cart
      parameters:
        - name: cartId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The cleared cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
  /cart/{cartId}/items:
    post:
      tags: [cart]
      operationId: addItemToCart
      summary: Add an item to the cart
      parameters:
        - name: cartId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddItemInput' }
      responses:
        '200':
          description: The updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
  /cart/{cartId}/items/{itemId}:
    patch:
      tags: [cart]
      operationId: updateCartItem
      summary: Update the quantity of a cart item
      parameters:
        - name: cartId
          in: path
          required: true
          schema: { type: string }
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateItemInput' }
      responses:
        '200':
          description: The updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
    delete:
      tags: [cart]
      operationId: removeItemFromCart
      summary: Remove an item from the cart
      parameters:
        - name: cartId
          in: path
          required: true
          schema: { type: string }
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
components:
  schemas:
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: integer }
        currency: { type: string }
    ProductRef:
      type: object
      required: [id, name, imageUrl]
      properties:
        id: { type: string }
        name: { type: string }
        imageUrl: { type: string }
    CartItem:
      type: object
      required: [id, productId, quantity, unitPrice, product]
      properties:
        id: { type: string }
        productId: { type: string }
        quantity: { type: integer }
        unitPrice: { $ref: '#/components/schemas/Money' }
        product: { $ref: '#/components/schemas/ProductRef' }
    Cart:
      type: object
      required: [id, items, subtotal, itemCount]
      properties:
        id: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/CartItem' }
        subtotal: { $ref: '#/components/schemas/Money' }
        itemCount: { type: integer }
    AddItemInput:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: string }
        quantity: { type: integer, minimum: 1 }
    UpdateItemInput:
      type: object
      required: [quantity]
      properties:
        quantity: { type: integer, minimum: 0 }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
