packages:
  - apps/*
  - libs/*
  - libs/shared/*
  - libs/mf/*
  - libs/server/*
  - libs/server/shared
  - libs/server/catalog-svc
autoInstallPeers: true
overrides:
  '@angular/router': 20.3.29
onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@prisma/client'
  - '@prisma/engines'
  - esbuild
  - lmdb
  - msgpackr-extract
  - nx
  - prisma
  - unrs-resolver
neverBuiltDependencies:
  - '@apollo/protobufjs'
  - '@scarf/scarf'
  - less
  - workerd
allowBuilds:
  '@apollo/protobufjs': false
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  nx: true
  prisma: true
  unrs-resolver: true
